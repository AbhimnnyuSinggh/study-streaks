name: Secret Scan

on:
    workflow_call:
   

jobs:
    Secrets_Scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              with:
                args: detact --verbose --redact