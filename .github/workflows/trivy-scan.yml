name: Trivy Scan

on:
  workflow_call:

jobs:
  trivy_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USER }}/study-streaks:latest
          severity: CRITICAL,HIGH
          exit-code: 1